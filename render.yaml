# ============================================================================
#  EduLink — قالب Blueprint للنشر على Render
#  https://render.com/docs/blueprint-spec
#
#  ⚠️ **لا يخزّن هذا الملف أي سر.** أي `sync: false` يعني: القيمة تُملأ من لوحة
#     Render (أو من Environment Group) ولا تُقرأ من Git. لا تكتب سلسلة الاتصال ولا
#     سرّ TURN هنا — المستودع عام على GitHub.
#
#  ⚠️ **الحقيقة التي تُفهم قبل الضغط على Deploy:** Render لا يوفّر SQL Server إطلاقًا
#     (قواعدهم المدارة Postgres وRedis فقط)، فالحاوية هنا هي **الـ API وحدها** والقاعدة
#     تبقى على سيرفرك وتصلها من الإنترنت. ولا تشغيل وسائط P2P بلا TURN: حاويات Render
#     بلا host networking وبلا مدى بوابات UDP، فـ coturn يحتاج عربة مستقلة.
#     (التفاصيل والمخاطرة: docs/12-render-deployment.md)
#
#  الاستخدام: ضعه في جذر المستودع على فرع `main`، ثم في Render:
#     New +"→" Blueprint → اختر المستودع → يعرض الخدمتين أدناه → املأ القيم `sync: false`
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  #  1) الـ API — ASP.NET Core (.NET 10) + SignalR، صورة Docker متعددة المراحل
  # ---------------------------------------------------------------------------
  - type: web
    name: edulink-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .                       # سياق البناء = جذر المستودع (كما في `docker build -f apps/api/Dockerfile .`)
    plan: starter                          # حاويات Render لا تملك خطة free؛ والمجاني أصلًا ينام بعد الخمول فيقطع اتصالات الغرفة
    healthCheckPath: /api/health/db        # لا يُحسب النشر ناجحًا قبل أن يقول { "provider":"SqlServer","canConnect":true }
    autoDeployTrigger: commit
    envVars:
      # ---------- التشغيل ----------
      - key: ASPNETCORE_ENVIRONMENT
        value: Production                  # خارج Development يرفض الـ API الإقلاع على Sqlite/سلسلة فارغة/EnsureCreated (خروج 1)

      # ---------- قاعدة البيانات ----------
      - key: Database__Provider
        value: SqlServer
      - key: Database__EnsureCreated
        value: "false"                     # المخطط من RUN-ON-SQL-SERVER.sql فقط — لا EF Migrations أبدًا
      - key: ConnectionStrings__SqlServer
        sync: false                        # ← املأها في Render. ⚠️ اقرأ قسم «التشفير» في docs/12 قبل استخدام Encrypt=False

      # ---------- وسيط Render (المدخل الوحيد) ----------
      # Render ينهي TLS ويضيف X-Forwarded-For بنفسه، فبلا هذا يُحسب كل زوار المؤسسة عنوانًا
      # واحدًا عند حدّ الدخول ⇒ 429 جماعي. والوسيط واحد، فالـ limit = 1 (رفعُه يجعل العميل
      # يفتح حزنة جديدة بترويسة مزوَّرة — مقيس في docs/11 §6).
      - key: Network__UseForwardedHeaders
        value: "true"
      - key: Network__ForwardedHeadersLimit
        value: "1"

      # ---------- أصل الواجهة ----------
      # CORS في Program.cs يقرأ `Cors:Origins`؛ والواجهة تُخدم على أصل مستقل (خدمة static
      # أدناه أو Vercel)، فبلا هذه القيمة يرفض المتصفح كل نداء /api. لا نجمة *: يُقفل على أصلك.
      - key: Cors__Origins__0
        value: https://edulink-web.onrender.com
      # - key: Cors__Origins__1
      #   value: https://YOUR-DOMAIN            # دومين المؤسسة (white-label) عند ربطه
      # ⚠️ القيمة يجب أن تكون **أصل خدمة الواجهة أدناه حرفيًا** (بروتوكول + نطاق، بلا مسار
      #    ولا شرطة مائلة نهائية)، وإلا رفض المتصفح كل نداء /api بلا رسالة واضحة.

      # ---------- تحديد المعدل ----------
      - key: RateLimit__LoginPermitPerMinute
        value: "120"
      - key: RateLimit__LoginFailuresPerAccount
        value: "8"
      - key: RateLimit__LoginLockoutMinutes
        value: "5"
      - key: RateLimit__ApiPermitPerMinute
        value: "600"
      - key: RateLimit__HubPermitPerMinute
        value: "3000"

      # ---------- الحصة الحيّة (WebRTC) ----------
      # بلا TURN معلَّق تعمل الغرف بـ STUN العام فقط — والواجهة تعرض تنبيهًا صريحًا بهذا
      # (لا سقوط بصمت). اتركهما فارغين حتى تُشغّل coturn على عربة مستقلة.
      - key: Meeting__TurnUrls__0
        sync: false
      - key: Meeting__TurnSecret
        sync: false
      - key: Meeting__TurnTtlSeconds
        value: "86400"

  # ---------------------------------------------------------------------------
  #  2) الواجهة — Vite + React (بناء إنتاجي يُخدَم static)
  # ---------------------------------------------------------------------------
  - type: web
    name: edulink-web
    runtime: static
    staticPublishPath: ./apps/web/dist
    buildCommand: npm ci && npm run build     # سكربت الجذر يبني الـ workspace الخاص بالواجهة
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"                           # نفس العقدة التي يُقاس بها البناء محليًا (engines: >=20)
      # الواجهة تُبنى بهذا العنوان (build-time لا runtime): فارغ = مسار نسبي، وهذا لا يصلح
      # حين تُخدم الواجهة على أصل مختلف عن الـ API (كسر الغرفة الحيّة مرّ بهذا من قبل).
      - key: VITE_API_BASE_URL
        value: https://edulink-api.onrender.com
    routes:
      - type: rewrite                         # دعم SPA للتوجيهات العميقة (/reports، /students/3)
        src: /*
        dest: /index.html
