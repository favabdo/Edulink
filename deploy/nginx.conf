# nginx للإنتاج — EduLink
# - يُنهي TLS ويحوّل REST وSignalR (WebSocket) إلى حاوية الـ API.
# - يخدم ملفات الواجهة الثابتة من /usr/share/nginx/html (apps/web/dist).
# - لا يخمّن أسماء المضيفين: عدّل server_name وشهادات TLS قبل التشغيل.

server {
    listen 80;
    server_name YOUR-DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR-DOMAIN;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # حد رفع يكفي ملفات صغيرة (لن تُرفع تسجيلات — المنصة لا تسجّل)
    client_max_body_size 2m;

    # ===== الواجهة (SPA) =====
    root /usr/share/nginx/html;
    index index.html;

    # الأصول المبنية بكود إسمنتي — كاش دائم
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ===== REST API =====
    location /api/ {
        proxy_pass http://api:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== SignalR (غرف الاجتماعات) =====
    # ترقية WebSocket تتطلب هذه الترويسات ومنافذ قراءة طويلة
    location /hubs/ {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 100s;   # KeepAlive=15s × عدة نبضات
        proxy_send_timeout 100s;
        proxy_buffering off;
    }
}
