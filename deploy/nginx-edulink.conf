# ============================================================================
#  EduLink — بلوك nginx يُضمَّن في خادم الموقع الموجود على السيرفر (نفس شكل
#  /nilechat: تطبيق واحد تحت بادئة مسار، وواجهة + API + غرفة من نفس الأصل).
#
#  يُضاف هذا الملف إلى إعداد nginx بعد `http`/`server` الموجود (مثال التضمين
#  في docs/06-deployment.md). لا يفتح دومينًا جديدًا ولا منفذًا جديدًا.
#
#  ثلاثة أماكن تُعدَّل فقط: اسم البادئة `/edulink`، ومجلد `web` (مخرجات البناء)،
#  ومنفذ الـ API على 127.0.0.1. البادئة يجب أن تساوي `VITE_BASE_PATH` وقت البناء.
#
#  ⚠️ هذه البلوكات تحمل ترويسات الأمان والكاش التي كانت في `vercel.json` قبل
#  حذفه — فحذفه بلا نقلها يُسقط حماية الكاميرا/المايك و`nosniff` والكاش الدائم
#  للأصول المُوقَّعة ببصمة المحتوى.
# ============================================================================

# الواجهة: ملفات بعد `npm run build` (apps/web/dist) — SPA، فكل رابط عميق يرجع
# إلى index.html ولا يرجع 404 من nginx.
location /edulink/ {
    alias /home/YOUR-USER/edulink/web/;
    index index.html;
    try_files $uri $uri/ /edulink/index.html;
    add_header Cache-Control "no-cache";

    # ترويسات الأمان (كانت في vercel.json — نُقلت كما هي)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # مقصودة: الحصص الحيّة تحتاج الكاميرا والمايك من نفس النطاق؛ الموقع مُعطَّل.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
}

# الأصول المبنية باسم يحتوي بصمة المحتوى، والخطوط والأيقونات ثابتة الأسماء — كاش دائم.
location /edulink/assets/ {
    alias /home/YOUR-USER/edulink/web/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location /edulink/fonts/ {
    alias /home/YOUR-USER/edulink/web/fonts/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location /edulink/icons/ {
    alias /home/YOUR-USER/edulink/web/icons/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# ===== الـ API (REST) =====
# المسار يُجرَّد: /edulink/api/auth/login → /api/auth/login عند الـ API، فلا يحتاج
# أي PathBase في الكود. `Host` يبقى كما أرسله المتصفح.
location /edulink/api/ {
    proxy_pass http://127.0.0.1:5279/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;      # المنصة لا ترفع تسجيلات — ملفات صغيرة فقط
}

# ===== SignalR (الحصة الحيّة) =====
# ترقية WebSocket تتطلب الترويسات التالية، ومنافذ قراءة أطول من KeepAlive (15 ث).
location /edulink/hubs/ {
    proxy_pass http://127.0.0.1:5279/hubs/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 100s;
    proxy_send_timeout 100s;
    proxy_buffering off;
}
