# coturn للإنتاج — خادم احتياطي لـ WebRTC عند تعذر الاتصال المباشر (NAT صارم)
#
# قواعد الربط مع إعدادات الـ API (في .env):
#   shared-secret-list = SAME_VALUE_AS_Meeting__TurnSecret   ← التوكنات يوقّعها الـ API (TURN REST)
#   realm = نفس النطاق الذي يُرسل في Meeting__TurnUrls
#
# منافذ يجب فتحها في جدار النار:
#   3478/udp + 3478/tcp (STUN/TURN)   |   5349/tcp (TURNs خلف nginx TLS-termination لا يلزم هنا)
#   49160-49200/udp (وسائط rellayed)

listening-port=3478
fingerprint

# النطاق العام للسيرفر — عدّله
realm=YOUR-DOMAIN

# تقييد السيرفر على الشبكة/العناوين العامة إن لزم
# external-address=PUBLIC_IP

# السر المشترك — يجب أن يطابق Meeting__TurnSecret في .env
use-auth-secret
static-auth-secret=REPLACE_WITH_MEETING_TURN_SECRET

# النطاق المسموح للوسائط الوسيطة
min-port=49160
max-port=49200

# الأمان: منع الوصول إلى شبكات الداخل
no-multicast-peers
no-cli
no-loopback-peers
no-tcp-relay
denied-peer-ip=0.0.0.0-255.255.255.255
allowed-peer-ip=0.0.0.0-255.255.255.255

# السجل
log-file=/var/log/turnserver/turnserver.log
simple-log
pidfile=/var/run/turnserver.pid
